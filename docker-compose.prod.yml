name: nanopods-house

# Production compose: runs a prebuilt image (built off-box, transferred via
# `docker save`/`docker load`). No build step, no source mounts — static_site
# and i18n are baked into the image. The VM only needs:
#   - this file
#   - a .env with WEB_PORT + LEAD_* + POSTGRES_*/DATABASE_URL vars
#   - the loaded app image (nanopods-house-web:latest)
#   - outbound net to pull postgres:16-alpine (or pre-load it too)
#
# Run:  docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: nanopods-house-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nanopods}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanopods}
      POSTGRES_DB: ${POSTGRES_DB:-nanopods}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanopods} -d ${POSTGRES_DB:-nanopods}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: nanopods-house-web:latest
    container_name: nanopods-house-web
    env_file: .env
    environment:
      # Always target the `db` service over the compose network. NOT derived from
      # the host DATABASE_URL in .env (that one points at the published host port
      # for `npm run dev` and would be wrong inside the container).
      DATABASE_URL: postgres://${POSTGRES_USER:-nanopods}:${POSTGRES_PASSWORD:-nanopods}@db:5432/${POSTGRES_DB:-nanopods}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Legacy JSON backups (and anything else under /app/data) persist here.
      # Submissions now live in Postgres (pgdata volume below).
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
